<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KNIGHTS: LAST STANDING — 3D Arena Fighter</title>
    <meta name="description" content="3D арена на выживание. 9 рыцарей, 27 навыков, магазин, монеты, многопользовательский режим." />
    <meta name="keywords" content="рыцари, арена, сражения, многопользовательская игра, 3d, боевик" />
    <!-- Яндекс Игры SDK -->
    <script src="/sdk.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #090d16;
        color: #f8fafc;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 35% 30%, rgba(37, 99, 235, 0.22) 0%, transparent 52%),
          radial-gradient(circle at 65% 65%, rgba(14, 165, 233, 0.16) 0%, transparent 52%),
          #090d16;
        text-align: center;
        padding: 24px;
      }
      .boot-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #e2e8f0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }
      .boot-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 10px #38bdf8;
      }
      .boot-title {
        font-size: clamp(28px, 4.2vw, 44px);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
        margin: 0 0 20px;
      }
      .boot-bar {
        width: min(240px, 68vw);
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .boot-bar-fill {
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #0ea5e9, #2563eb, #38bdf8);
        animation: bootPulse 1s ease-in-out infinite alternate;
      }
      .boot-status {
        margin-top: 14px;
        font-size: 12.5px;
        font-weight: 500;
        color: #94a3b8;
        max-width: 520px;
        line-height: 1.5;
      }
      @keyframes bootPulse {
        from { transform: translateX(-25%); width: 42%; }
        to { transform: translateX(135%); width: 55%; }
      }
    </style>
  </head>
  <body>
    <div id="game-canvas-root"></div>
    <div id="ui-root">
      <div id="boot-splash">
        <div class="boot-badge"><span class="boot-dot"></span><span id="boot-badge-text">3D Арена на выживание</span></div>
        <h1 class="boot-title">Knights: Last Standing</h1>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        <div id="boot-status" class="boot-status">Запуск арены...</div>
      </div>
    </div>
    <script>
      (function () {
        var bootTexts = {
          ru: ['3D Арена на выживание', 'Запуск арены...', 'Ошибка запуска: ', 'Не загрузился ', 'Открыт статический предпросмотр. Откройте предпросмотр сервера.', 'Загрузка модулей игры...'],
          en: ['3D survival arena', 'Starting the arena...', 'Startup error: ', 'Failed to load ', 'Static preview detected. Open the server preview.', 'Loading game modules...'],
          tr: ['3D hayatta kalma arenası', 'Arena başlatılıyor...', 'Başlatma hatası: ', 'Yüklenemedi: ', 'Statik önizleme açıldı. Sunucu önizlemesini açın.', 'Oyun modülleri yükleniyor...'],
          es: ['Arena de supervivencia 3D', 'Iniciando la arena...', 'Error de inicio: ', 'No se pudo cargar ', 'Vista estática detectada. Abre la vista del servidor.', 'Cargando módulos del juego...'],
          ar: ['ساحة بقاء ثلاثية الأبعاد', 'جارٍ تشغيل الساحة...', 'خطأ في بدء التشغيل: ', 'تعذر تحميل ', 'تم فتح معاينة ثابتة. افتح معاينة الخادم.', 'جارٍ تحميل وحدات اللعبة...']
        };
        var language = (navigator.language || 'ru').toLowerCase().split(/[-_]/)[0];
        try {
          var saved = JSON.parse(localStorage.getItem('knights_last_standing_settings_v2') || '{}');
          if (bootTexts[saved.language]) language = saved.language;
        } catch (_) {}
        var texts = bootTexts[language] || bootTexts.ru;
        document.documentElement.lang = bootTexts[language] ? language : 'ru';
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('boot-badge-text').textContent = texts[0];
        document.getElementById('boot-status').textContent = texts[1];
        var bootFailed = false;
        window.__knightsBooted = false;
        window.__reportBootIssue = function (msg) {
          bootFailed = true;
          var el = document.getElementById('boot-status');
          if (el) {
            el.style.color = '#fca5a5';
            el.textContent = texts[2] + msg;
          }
          try {
            fetch('/api/client-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: String(msg), href: location.href })
            }).catch(function () {});
          } catch (_) {}
        };

        window.addEventListener('error', function (e) {
          if (window.__knightsBooted) return;
          var t = e.target;
          if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            window.__reportBootIssue(texts[3] + (t.src || t.href || t.tagName));
            return;
          }
          if (e.message) {
            window.__reportBootIssue(e.message);
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (window.__knightsBooted) return;
          var reason = e.reason && (e.reason.message || String(e.reason));
          window.__reportBootIssue(reason || 'Unhandled rejection');
        });

        setTimeout(function () {
          if (!window.__knightsBooted) {
            var el = document.getElementById('boot-status');
            if (el && !bootFailed) {
              if (location.protocol === 'about:' || location.protocol === 'blob:' || location.protocol === 'file:') {
                el.style.color = '#fde68a';
                el.textContent = texts[4];
              } else {
                el.textContent = texts[5];
              }
            }
          }
        }, 2500);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
