<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KNIGHTS: LAST STANDING — Medieval 3D Arena Fighter</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0d14;
        color: #f5ebd2;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 42%, #1b2030 0%, #0b0d14 72%);
        text-align: center;
        padding: 24px;
      }
      .boot-badge {
        color: #f0c362;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .boot-title {
        font-size: clamp(26px, 4vw, 40px);
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #fff6dc;
        margin: 0 0 14px;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.75);
      }
      .boot-bar {
        width: min(260px, 70vw);
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(240, 195, 98, 0.45);
        overflow: hidden;
      }
      .boot-bar-fill {
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #b88328, #ffe294, #b88328);
        animation: bootPulse 1.1s ease-in-out infinite alternate;
      }
      .boot-status {
        margin-top: 12px;
        font-size: 13px;
        color: #b7c2d8;
        max-width: 560px;
        line-height: 1.45;
      }
      @keyframes bootPulse {
        from { transform: translateX(-25%); width: 45%; }
        to { transform: translateX(135%); width: 55%; }
      }
    </style>
  </head>
  <body>
    <div id="game-canvas-root"></div>
    <div id="ui-root">
      <div id="boot-splash">
        <div class="boot-badge">⚔ Цитадель арены ⚔</div>
        <h1 class="boot-title">KNIGHTS: LAST STANDING</h1>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        <div id="boot-status" class="boot-status">Загрузка зала цитадели...</div>
      </div>
    </div>
    <script>
      (function () {
        window.__knightsBooted = false;
        window.__reportBootIssue = function (msg) {
          var el = document.getElementById('boot-status');
          if (el) {
            el.style.color = '#fca5a5';
            el.textContent = 'Ошибка запуска: ' + msg;
          }
          try {
            fetch('/api/client-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: String(msg), href: location.href })
            }).catch(function () {});
          } catch (_) {}
        };

        window.addEventListener('error', function (e) {
          if (window.__knightsBooted) return;
          var t = e.target;
          if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            window.__reportBootIssue('Не загрузился ' + (t.src || t.href || t.tagName));
            return;
          }
          if (e.message) {
            window.__reportBootIssue(e.message);
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (window.__knightsBooted) return;
          var reason = e.reason && (e.reason.message || String(e.reason));
          window.__reportBootIssue(reason || 'Unhandled rejection');
        });

        setTimeout(function () {
          if (!window.__knightsBooted) {
            var el = document.getElementById('boot-status');
            if (el && el.textContent.indexOf('Ошибка') === -1) {
              if (location.protocol === 'about:' || location.protocol === 'blob:' || location.protocol === 'file:') {
                el.style.color = '#fde68a';
                el.textContent = 'Открыт статический предпросмотр файла. Переключитесь на вкладку превью сервера «Website» (порт 5173).';
              } else {
                el.textContent = 'Загрузка модулей игры (' + location.host + ')...';
              }
            }
          }
        }, 2500);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
