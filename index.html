<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KNIGHTS: LAST STANDING — 3D Arena Fighter</title>
    <meta name="description" content="3D арена на выживание. 9 рыцарей, 27 навыков, магазин, монеты, многопользовательский режим." />
    <meta name="keywords" content="рыцари, арена, сражения, многопользовательская игра, 3d, боевик" />
    <!-- Яндекс Игры SDK -->
    <script src="/sdk.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #090d16;
        color: #f8fafc;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #boot-splash {
        position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
        background: radial-gradient(ellipse at 75% 20%, rgba(50, 162, 230, .3), transparent 42%),
          radial-gradient(ellipse at 15% 85%, rgba(20, 97, 174, .3), transparent 46%), #081522;
        padding: 24px; box-sizing: border-box; overflow: auto;
      }
      .boot-card {
        width: min(860px, 100%); display: grid; grid-template-columns: 1fr .88fr;
        align-items: center; gap: 36px; padding: clamp(24px, 5vw, 52px);
        box-sizing: border-box; border: 1px solid rgba(165, 224, 255, .3); border-radius: 28px;
        background: linear-gradient(140deg, rgba(31, 76, 106, .78), rgba(8, 26, 46, .9));
        box-shadow: 0 28px 90px rgba(0, 7, 20, .52), inset 0 1px rgba(255,255,255,.13);
      }
      .boot-copy { min-width: 0; }
      .boot-badge { color: #92dfff; font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
      .boot-dot { display: inline-block; width: 7px; height: 7px; margin-inline-end: 9px; border-radius: 50%; background: #79e3ff; box-shadow: 0 0 14px #5ed2ff; }
      .boot-title { margin: 16px 0 10px; color: #fff; font-family: Georgia, serif; font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -.04em; }
      .boot-subtitle { margin: 0 0 30px; color: #b9d7e9; font-size: 13px; letter-spacing: .13em; text-transform: uppercase; }
      .boot-bar { width: 100%; height: 5px; border-radius: 99px; background: rgba(160, 215, 244, .16); overflow: hidden; }
      .boot-bar-fill { width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, transparent, #5bcaff, #d1f5ff); animation: bootPulse 1.45s ease-in-out infinite; }
      .boot-status { min-height: 20px; margin-top: 15px; color: #e3f5ff; font-size: 13px; font-weight: 600; line-height: 1.5; }
      .boot-hint { margin: 12px 0 0; color: #c8dfeb; font-size: 12px; line-height: 1.5; }
      .boot-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
      .boot-actions:has(button:not([hidden])) { margin-top: 16px; }
      .boot-actions button { cursor: pointer; border-radius: 10px; border: 1px solid rgba(143, 218, 252, .45); background: rgba(33, 118, 163, .35); color: white; padding: 10px 14px; font: inherit; font-size: 12px; }
      .boot-actions button:hover { background: rgba(47, 153, 204, .55); }
      .boot-actions button[hidden], .boot-hint[hidden] { display: none; }
      .boot-art { position: relative; padding: 8px; border-radius: 26px; background: rgba(148, 220, 255, .1); border: 1px solid rgba(180, 230, 255, .22); box-shadow: 0 18px 48px rgba(0,0,0,.25); }
      .boot-art img { display: block; width: 100%; height: auto; border-radius: 19px; }
      @keyframes bootPulse { 0% { transform: translateX(-110%); } 100% { transform: translateX(240%); } }
      @media (max-width: 560px), (max-height: 460px) {
        .boot-card { grid-template-columns: 1fr; max-width: 480px; gap: 16px; padding: 24px; }
        .boot-art { display: none; }
        .boot-title { margin: 10px 0 6px; font-size: 32px; }
        .boot-subtitle { margin-bottom: 18px; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-bar-fill { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="game-canvas-root"></div>
    <div id="ui-root" inert aria-hidden="true"></div>
    <div id="boot-splash">
      <div class="boot-card">
        <div class="boot-copy">
          <div class="boot-badge"><span class="boot-dot"></span><span id="boot-badge-text">3D Арена на выживание</span></div>
          <h1 class="boot-title">Knights:<br>Last Standing</h1>
          <p id="boot-subtitle" class="boot-subtitle">Арена ждёт своих героев</p>
          <div class="boot-bar" aria-hidden="true"><div class="boot-bar-fill"></div></div>
          <div id="boot-status" class="boot-status" role="status" aria-live="polite">Запуск арены...</div>
          <p id="boot-hint" class="boot-hint" hidden></p>
          <div class="boot-actions"><button type="button" id="boot-retry" hidden></button><button type="button" id="boot-continue" hidden></button></div>
        </div>
        <div class="boot-art" aria-hidden="true"><img src="./images/loading-knight.jpg" alt="" width="512" height="512"></div>
      </div>
    </div>
    <script>
      (function () {
        var bootTexts = {
          ru: ['3D Арена на выживание', 'Запуск арены...', 'Ошибка запуска: ', 'Не загрузился ', 'Открыт статический предпросмотр. Откройте предпросмотр сервера.', 'Загрузка модулей игры...'],
          en: ['3D survival arena', 'Starting the arena...', 'Startup error: ', 'Failed to load ', 'Static preview detected. Open the server preview.', 'Loading game modules...'],
          tr: ['3D hayatta kalma arenası', 'Arena başlatılıyor...', 'Başlatma hatası: ', 'Yüklenemedi: ', 'Statik önizleme açıldı. Sunucu önizlemesini açın.', 'Oyun modülleri yükleniyor...'],
          es: ['Arena de supervivencia 3D', 'Iniciando la arena...', 'Error de inicio: ', 'No se pudo cargar ', 'Vista estática detectada. Abre la vista del servidor.', 'Cargando módulos del juego...'],
          ar: ['ساحة بقاء ثلاثية الأبعاد', 'جارٍ تشغيل الساحة...', 'خطأ في بدء التشغيل: ', 'تعذر تحميل ', 'تم فتح معاينة ثابتة. افتح معاينة الخادم.', 'جارٍ تحميل وحدات اللعبة...']
        };
        var defaultEnglish = document.documentElement.dataset.defaultLanguage === 'en';
        var language = defaultEnglish ? 'en' : (navigator.language || 'ru').toLowerCase().split(/[-_]/)[0];
        try {
          var saved = JSON.parse(localStorage.getItem('knights_last_standing_settings_v2') || '{}');
          var auto = localStorage.getItem('kls_language_preference_manual') === 'auto';
          if (bootTexts[saved.language] && (!defaultEnglish || !auto)) language = saved.language;
        } catch (_) {}
        var texts = bootTexts[language] || bootTexts.ru;
        document.documentElement.lang = bootTexts[language] ? language : 'ru';
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('boot-badge-text').textContent = texts[0];
        document.getElementById('boot-subtitle').textContent = ({ ru: 'Арена ждёт своих героев', en: 'The arena awaits', tr: 'Arena kahramanlarını bekliyor', es: 'La arena te espera', ar: 'الساحة تنتظر أبطالها' })[language] || 'Арена ждёт своих героев';
        document.getElementById('boot-status').textContent = texts[1];
        var bootFailed = false;
        window.__knightsBooted = false;
        window.__reportBootIssue = function (msg) {
          bootFailed = true;
          var el = document.getElementById('boot-status');
          if (el) {
            el.style.color = '#fca5a5';
            el.textContent = texts[2] + msg;
          }
          try {
            fetch('/api/client-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: String(msg), href: location.href })
            }).catch(function () {});
          } catch (_) {}
        };

        window.addEventListener('error', function (e) {
          if (window.__knightsBooted) return;
          var t = e.target;
          if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            window.__reportBootIssue(texts[3] + (t.src || t.href || t.tagName));
            return;
          }
          if (e.message) {
            window.__reportBootIssue(e.message);
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (window.__knightsBooted) return;
          var reason = e.reason && (e.reason.message || String(e.reason));
          window.__reportBootIssue(reason || 'Unhandled rejection');
        });

        setTimeout(function () {
          if (!window.__knightsBooted && !window.__knightsLoadingStarted) {
            var el = document.getElementById('boot-status');
            if (el && !bootFailed) {
              if (location.protocol === 'about:' || location.protocol === 'blob:' || location.protocol === 'file:') {
                el.style.color = '#fde68a';
                el.textContent = texts[4];
              } else {
                el.textContent = texts[5];
              }
            }
          }
        }, 2500);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
