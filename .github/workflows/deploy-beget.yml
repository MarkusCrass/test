name: Build & Deploy to Beget (ezekie6n.beget.tech)

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate PHP multiplayer relay syntax & functional smoke test
        run: |
          php -l public/api/mp.php
          php -r '$_GET["action"]="connect"; $_SERVER["REQUEST_METHOD"]="POST"; ob_start(); include "public/api/mp.php";' | grep -q '"relayMode":"host_sim"'

      - name: Install dependencies, test & build production bundle
        run: |
          npm ci
          npm test
          npm run build
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/mp.php

      - name: Package Beget public_html archives (.zip & .tar.gz)
        run: |
          (cd dist && zip -rq ../knights-beget-public_html.zip . .htaccess)
          (cd dist && tar -czf ../knights-beget-public_html.tar.gz .)
          ls -lh knights-beget-public_html.zip knights-beget-public_html.tar.gz

      - name: Publish public Beget release (beget-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view beget-latest >/dev/null 2>&1; then
            gh release upload beget-latest knights-beget-public_html.zip knights-beget-public_html.tar.gz --clobber
          else
            gh release create beget-latest knights-beget-public_html.zip knights-beget-public_html.tar.gz \
              --target "${{ github.sha }}" \
              --title "KNIGHTS: LAST STANDING — Готовая сборка для Beget (public_html)" \
              --notes "Готовый архив сайта для распаковки в \`ezekie6n.beget.tech/public_html\` на хостинге Beget (включает 3D-арену, звуки, иконки, \`.htaccess\` и PHP-сервер мультиплеера \`api/mp.php\`)."
          fi

      - name: Upload ready-to-host Beget archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: knights-beget-public_html
          path: dist/
          include-hidden-files: true

      - name: Deploy dist/ to ezekie6n.beget.tech via Beget FTP
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST || 'ezekie6n.beget.tech' }}
          BEGET_USER: ${{ secrets.BEGET_USER || 'ezekie6n' }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
          BEGET_DIR_OVERRIDE: ${{ secrets.BEGET_SERVER_DIR }}
        run: |
          if [ -z "$BEGET_PASSWORD" ]; then
            echo "### ℹ️ Автодеплой по FTP ожидает секрет BEGET_PASSWORD" >> "$GITHUB_STEP_SUMMARY"
            echo "Добавьте секрет \`BEGET_PASSWORD\` (пароль от аккаунта/FTP Beget \`ezekie6n\`) в Settings → Secrets and variables → Actions, чтобы каждый push автоматически заливал сайт на http://ezekie6n.beget.tech/." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          lftp -u "$BEGET_USER","$BEGET_PASSWORD" "$BEGET_HOST" <<EOF
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 20
          set ftp:passive-mode true

          cd "${BEGET_DIR_OVERRIDE:-/ezekie6n.beget.tech/public_html}" || cd "/public_html" || cd "/"

          mirror --reverse --delete --verbose --parallel=6 dist/ ./
          bye
          EOF
